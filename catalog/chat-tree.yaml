name: chat-tree
title: Chat Tree
repo: https://github.com/Ronitron007/hermes-concept-links
sha: "0000000000000000000000000000000000000000"
subdir: chat-tree
description: >-
  One window for branching chats in Hermes Desktop. A side pane draws the open
  chat and its branches as a git graph, one node for each exchange. Branch
  from a node, ask on a cheaper model, and merge back into any ancestor chat
  with Merge as-is or Digest. The model writes each digest through ctx.llm
  (auxiliary task chat_tree_digest, which follows the title generation model
  unless you set auxiliary.chat_tree_digest). Disclosure: reads up to 500
  persisted session summaries and the history of each chat in the focused
  lineage through the public Desktop SDK. The Python half serves one plugin
  RPC method, plugin.chat-tree.digest.write, which sends the exchanges of one
  chat (at most 24,000 characters, secrets redacted) to your configured model
  and returns the digest as a session event. No
  other external services, credentials, filesystem access, shell, telemetry
  or self-updater.
maintainer: Ronitron007
tier: community
category: desktop
requires_hermes: ">=0.23"
version: "0.1.0"
docs_url: https://github.com/Ronitron007/hermes-concept-links/tree/main/chat-tree#readme
readme: true
platforms: []
known_issues:
  - Requires Hermes Desktop.
  - A click opens the chat of a node. Hermes has no API to scroll to one message.
  - Digests need hermes plugins enable chat-tree and a gateway restart.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
