name: chat-tree
title: Chat Tree
repo: https://github.com/Ronitron007/hermes-concept-links
sha: "0000000000000000000000000000000000000000"
subdir: chat-tree
description: >-
  A git-graph tree of the open chat, its forks and its side chats, in a side
  pane. Each node is one exchange. Blue marks the path to the open node and
  grey marks the rest. Long runs fold to a +N row, and a click on a node opens
  its chat. Disclosure: reads up to 500 persisted session summaries and the
  history of each chat in the focused lineage through the public Desktop SDK.
  No external services, credentials, filesystem access, shell, backend,
  telemetry or self-updater.
maintainer: Ronitron007
tier: community
category: desktop
requires_hermes: ">=0.23"
version: "0.1.0"
docs_url: https://github.com/Ronitron007/hermes-concept-links#readme
readme: true
platforms: []
known_issues:
  - Requires Hermes Desktop.
  - A click opens the chat of a node. Hermes has no API to scroll to one message.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
