name: chat-tree
label: Chat Tree
kind: standalone
version: 0.1.0
author: Rohan Malik
license: MIT
description: >
  A git-graph tree of the open chat and its branches, in a side pane of Hermes
  Desktop (desktop/plugin.js). This Python half serves one route,
  POST /api/plugins/chat-tree/digest, which writes fork and merge digests with
  the model through ctx.llm.complete_structured. The digests use the
  chat_tree_digest auxiliary task, which follows the title generation model
  until you set auxiliary.chat_tree_digest. No agent tools, hooks or env vars.
provides_tools: []
provides_hooks: []
requires_hermes: ">=0.23"
